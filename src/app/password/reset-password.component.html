<div class="row mt-5">
  <div class="col-md-4 offset-4">
    <div class="card">
      <div class="card-body">
        <div class="text-center">
          <h5 class="card-title">Redefinir senha</h5>
          <p class="card-subtitle">Informe sua nova senha.</p>
        </div>
        <hr />

        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="newPassword" class="form-label">Nova senha</label>
            <input id="newPassword" type="password" class="form-control" formControlName="newPassword" />
            <div *ngIf="f.newPassword.touched && f.newPassword.invalid" class="text-danger mt-1">
              <div *ngIf="f.newPassword.errors?.['required']">Campo obrigatório.</div>
              <div *ngIf="f.newPassword.errors?.['minlength']">Mínimo 8 caracteres.</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmar senha</label>
            <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword" />
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" type="submit" [disabled]="isLoading || form.invalid">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Redefinir senha
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
