<div class="row mt-5">
  <div class="col-md-4 offset-4">
    <div class="card">
      <div class="card-body">
        <div class="text-center">
          <h5 class="card-title">Esqueci minha senha</h5>
          <p class="card-subtitle">Informe seu e-mail para receber instruções de redefinição.</p>
        </div>
        <hr />

        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input id="email" type="email" class="form-control" formControlName="email" placeholder="seu@exemplo.com" />
            <div *ngIf="f.email.touched && f.email.invalid" class="text-danger mt-1">
              <div *ngIf="f.email.errors?.['required']">Campo obrigatório.</div>
              <div *ngIf="f.email.errors?.['email']">E-mail inválido.</div>
            </div>
          </div>

          <div class="d-grid">
            <button class="btn btn-primary" type="submit" [disabled]="isLoading || form.invalid">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Enviar instruções
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
